[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-remote-bridge"
version = "0.2.7"
description = "Secure Windows bridge for Interestellar Remote"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pystray>=0.19,<1",
  "qrcode[pil]>=8,<9",
  "uvicorn[standard]>=0.32,<1",
  "pywin32>=308; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1"]

[project.scripts]
agy-remote = "agy_remote.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_remote"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
